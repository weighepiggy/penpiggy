    <script>
    var audioMap = {};

    function toggleAudio(img) {
    var src = img.getAttribute('data-audio');
    
    if (!audioMap[src]) {
      audioMap[src] = new Audio(src);
    }
    
    var audio = audioMap[src];
    
    if (audio.paused) {
       audio.play();
     } else {
       audio.pause();
     }
    }

    function loadPage(url) {
    document.getElementById('pageFrame').src = url
    }
</script>
